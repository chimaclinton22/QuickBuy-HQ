<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – QuickBuy HQ</title>
  <meta name="description" content="Set a new password for your QuickBuy HQ account." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#087EBC',
              dark: '#075985',
              navy: '#0B1F33',
              orange: '#F97316',
              orangeDark: '#EA580C'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16 md:h-20">
        <a href="index.html">
          <img src="https://i.imgur.com/vozqi5x_d.webp?maxwidth=760&fidelity=grand" 
               alt="QuickBuy HQ" class="h-10 md:h-12 w-auto object-contain">
        </a>
        <a href="login.html" class="text-sm font-medium text-slate-600 hover:text-brand-blue transition">
          Back to Sign In →
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 py-12 sm:py-16">
    <div class="w-full max-w-md">

      <!-- Card -->
      <div class="bg-white rounded-3xl border border-slate-100 shadow-xl p-8 sm:p-10">
        
        <!-- Icon & Title -->
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-lock text-2xl text-brand-blue"></i>
          </div>
          <h1 class="text-2xl font-black text-slate-900 mb-2">Set New Password</h1>
          <p class="text-slate-500 text-sm leading-relaxed">
            Enter your new password below to complete the reset.
          </p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden mb-5 bg-red-50 border border-red-100 text-red-600 text-sm rounded-xl px-4 py-3">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-text">Something went wrong</span>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden mb-5 bg-emerald-50 border border-emerald-100 text-emerald-700 text-sm rounded-xl px-4 py-3">
          <i class="fa-solid fa-circle-check mr-2"></i>
          <span id="success-text">Password updated successfully!</span>
        </div>

        <!-- Form -->
        <form id="reset-form" class="space-y-5">

          <!-- New Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input id="password" type="password" required minlength="6" placeholder="Minimum 6 characters"
                     class="w-full border border-slate-200 rounded-xl pl-11 pr-12 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue transition">
              <button type="button" id="toggle-password" 
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1.5">Confirm New Password</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input id="confirm-password" type="password" required placeholder="Re-enter new password"
                     class="w-full border border-slate-200 rounded-xl pl-11 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue transition">
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" id="submit-btn"
                  class="w-full bg-brand-blue hover:bg-brand-dark text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-brand-blue/20">
            <span id="btn-text">Update Password</span>
            <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
          </button>
        </form>

        <!-- Back to Login -->
        <p class="text-center text-sm text-slate-600 mt-8">
          <a href="login.html" class="font-semibold text-brand-blue hover:underline">Back to Sign In</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-400">
    <p>© 2026 QuickBuy HQ. All rights reserved.</p>
  </footer>

  <script>
    // ========== SUPABASE ==========
    const SUPABASE_URL = "https://zflruqzsbmiwvslcured.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6lR4Oh7YBMnPBxEx0Siy4A_QpTG8PHC";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========== TOGGLE PASSWORD ==========
    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.querySelector('#toggle-password i');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // ========== RESET PASSWORD ==========
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      const errorBox = document.getElementById('error-message');
      const successBox = document.getElementById('success-message');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const submitBtn = document.getElementById('submit-btn');

      // Reset messages
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      // Validation
      if (password !== confirmPassword) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Passwords do not match';
        return;
      }

      if (password.length < 6) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Password must be at least 6 characters';
        return;
      }

      // Loading state
      btnText.textContent = 'Updating...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        // Success
        successBox.classList.remove('hidden');
        document.getElementById('success-text').textContent = 'Password updated successfully! Redirecting to login...';

        // Redirect to login
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1800);

      } catch (err) {
        errorBox.classList.remove('hidden');
        document.getElementById('error-text').textContent = err.message || 'Failed to update password. The link may have expired.';
        
        btnText.textContent = 'Update Password';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
