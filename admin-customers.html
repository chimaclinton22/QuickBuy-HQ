<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers – QuickBuy HQ Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#087EBC',
              dark: '#075985',
              navy: '#0B1F33',
              orange: '#F97316'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-link.active { background: rgba(8, 126, 188, 0.15); color: #087EBC; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex min-h-screen">

    <!-- ========== SIDEBAR ========== -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex flex-col h-full">
        <div class="px-6 py-5 border-b border-slate-800">
          <a href="admin-dashboard.html">
            <img src="https://i.imgur.com/vozqi5x_d.webp?maxwidth=760&fidelity=grand" 
                 alt="QuickBuy HQ" class="h-9 object-contain brightness-0 invert">
          </a>
          <p class="text-xs text-slate-500 mt-1">Admin Command Center</p>
        </div>

        <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main</p>
          <a href="admin-dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
          </a>
          <a href="admin-orders.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-box w-5 text-center"></i> Orders
          </a>
          <a href="admin-products.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-tag w-5 text-center"></i> Products
          </a>
          <a href="admin-inventory.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-warehouse w-5 text-center"></i> Inventory
          </a>
          <a href="admin-customers.html" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
            <i class="fa-solid fa-users w-5 text-center"></i> Customers
          </a>

          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 mt-6">Insights</p>
          <a href="admin-analytics.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-line w-5 text-center"></i> Analytics
          </a>
          <a href="admin-reports.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-file-lines w-5 text-center"></i> Reports
          </a>
          <a href="admin-notifications.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-bell w-5 text-center"></i> Notifications
          </a>

          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 mt-6">Settings</p>
          <a href="admin-settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-gear w-5 text-center"></i> Settings
          </a>
          <a href="admin-store-settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-store w-5 text-center"></i> Store Settings
          </a>
          <a href="admin-team.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-user-group w-5 text-center"></i> Team
          </a>
        </nav>

        <div class="px-4 py-4 border-t border-slate-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-brand-blue flex items-center justify-center text-sm font-bold" id="admin-avatar">A</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate" id="admin-name">Admin</p>
              <p class="text-xs text-slate-500 truncate" id="admin-email">—</p>
            </div>
            <button id="logout-btn" class="text-slate-500 hover:text-red-400 transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <div class="flex-1 lg:ml-64">

      <!-- Top Bar -->
      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="flex items-center justify-between px-4 sm:px-6 h-16">
          <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="lg:hidden text-slate-600 text-xl">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-lg font-bold text-slate-900">Customers</h1>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="p-4 sm:p-6 lg:p-8">

        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-brand-blue">
                <i class="fa-solid fa-users"></i>
              </div>
              <div>
                <p class="text-xl font-black text-slate-900" id="stat-total">0</p>
                <p class="text-xs text-slate-500">Total Customers</p>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-500">
                <i class="fa-solid fa-user-check"></i>
              </div>
              <div>
                <p class="text-xl font-black text-slate-900" id="stat-active">0</p>
                <p class="text-xs text-slate-500">With Orders</p>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-orange-500">
                <i class="fa-solid fa-user-plus"></i>
              </div>
              <div>
                <p class="text-xl font-black text-slate-900" id="stat-new">0</p>
                <p class="text-xs text-slate-500">New This Month</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Search -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 sm:p-5 mb-6">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input id="search-input" type="text" placeholder="Search by name, email, or phone..."
                   class="w-full border border-slate-200 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue">
          </div>
        </div>

        <!-- Customers Table -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600">Customer</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden md:table-cell">Phone</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden lg:table-cell">Joined</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden sm:table-cell">Role</th>
                  <th class="text-right px-6 py-4 font-semibold text-slate-600">Actions</th>
                </tr>
              </thead>
              <tbody id="customers-table" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="5" class="px-6 py-16 text-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p>Loading customers...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <script>
    // ========== SUPABASE ==========
    const SUPABASE_URL = "https://zflruqzsbmiwvslcured.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6lR4Oh7YBMnPBxEx0Siy4A_QpTG8PHC";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allCustomers = [];

    // ========== SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    
    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    });
    overlay?.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    // ========== AUTH ==========
    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'admin-login.html';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role, full_name')
        .eq('id', user.id)
        .single();

      if (!profile || !['admin', 'staff'].includes(profile.role)) {
        await supabaseClient.auth.signOut();
        window.location.href = 'admin-login.html';
        return;
      }

      const name = profile.full_name || user.email?.split('@')[0] || 'Admin';
      document.getElementById('admin-name').textContent = name;
      document.getElementById('admin-email').textContent = user.email;
      document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();

      loadCustomers();
    }

    // ========== LOAD CUSTOMERS ==========
    async function loadCustomers() {
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('id, full_name, phone, role, created_at')
          .order('created_at', { ascending: false });

        if (error) throw error;

        // Get emails from auth is not possible via client easily,
        // so we show what we have in profiles
        allCustomers = data || [];
        
        // Filter to mainly show customers (but also show staff/admin for completeness)
        renderCustomers(allCustomers);
        updateStats(allCustomers);
      } catch (err) {
        console.error(err);
        document.getElementById('customers-table').innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-16 text-center text-slate-400">
              <i class="fa-solid fa-users text-3xl mb-3"></i>
              <p>No customers found</p>
            </td>
          </tr>`;
      }
    }

    function updateStats(customers) {
      const total = customers.length;
      const customersOnly = customers.filter(c => c.role === 'customer').length;
      
      // New this month
      const now = new Date();
      const thisMonth = customers.filter(c => {
        if (!c.created_at) return false;
        const d = new Date(c.created_at);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = customersOnly;
      document.getElementById('stat-new').textContent = thisMonth;
    }

    function renderCustomers(customers) {
      const tbody = document.getElementById('customers-table');

      if (!customers || customers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-16 text-center text-slate-400">
              <i class="fa-solid fa-users text-3xl mb-3"></i>
              <p>No customers found</p>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = customers.map(c => {
        const name = c.full_name || 'Unknown';
        const initials = name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        const joined = c.created_at 
          ? new Date(c.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
          : '—';

        const roleStyles = {
          customer: 'bg-blue-50 text-blue-700',
          staff: 'bg-purple-50 text-purple-700',
          admin: 'bg-orange-50 text-orange-700'
        };

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-brand-blue/10 text-brand-blue flex items-center justify-center text-sm font-bold flex-shrink-0">
                  ${initials || 'U'}
                </div>
                <div class="min-w-0">
                  <p class="font-semibold text-slate-900 truncate">${name}</p>
                  <p class="text-xs text-slate-500 truncate">${c.id?.slice(0, 8) || ''}...</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 hidden md:table-cell text-slate-600">${c.phone || '—'}</td>
            <td class="px-6 py-4 hidden lg:table-cell text-slate-600">${joined}</td>
            <td class="px-6 py-4 hidden sm:table-cell">
              <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold ${roleStyles[c.role] || roleStyles.customer}">
                ${(c.role || 'customer').charAt(0).toUpperCase() + (c.role || 'customer').slice(1)}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <a href="admin-customer-details.html?id=${c.id}" 
                 class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-blue hover:underline">
                View
                <i class="fa-solid fa-arrow-right text-xs"></i>
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    // ========== SEARCH ==========
    document.getElementById('search-input')?.addEventListener('input', (e) => {
      const search = e.target.value.toLowerCase().trim();
      const filtered = allCustomers.filter(c => 
        (c.full_name || '').toLowerCase().includes(search) ||
        (c.phone || '').toLowerCase().includes(search)
      );
      renderCustomers(filtered);
    });

    // ========== LOGOUT ==========
    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      if (!confirm('Logout from admin panel?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'admin-login.html';
    });

    // ========== INIT ==========
    checkAuth();
  </script>
</body>
</html>
