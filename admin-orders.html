<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders – QuickBuy HQ Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#087EBC',
              dark: '#075985',
              navy: '#0B1F33',
              orange: '#F97316'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-link.active { background: rgba(8, 126, 188, 0.15); color: #087EBC; }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex min-h-screen">

    <!-- ========== SIDEBAR ========== -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex flex-col h-full">
        <div class="px-6 py-5 border-b border-slate-800">
          <a href="admin-dashboard.html">
            <img src="https://i.imgur.com/vozqi5x_d.webp?maxwidth=760&fidelity=grand" 
                 alt="QuickBuy HQ" class="h-9 object-contain brightness-0 invert">
          </a>
          <p class="text-xs text-slate-500 mt-1">Admin Command Center</p>
        </div>

        <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main</p>
          <a href="admin-dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
          </a>
          <a href="admin-orders.html" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
            <i class="fa-solid fa-box w-5 text-center"></i> Orders
          </a>
          <a href="admin-products.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-tag w-5 text-center"></i> Products
          </a>
          <a href="admin-inventory.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-warehouse w-5 text-center"></i> Inventory
          </a>
          <a href="admin-customers.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-users w-5 text-center"></i> Customers
          </a>

          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 mt-6">Insights</p>
          <a href="admin-analytics.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-chart-line w-5 text-center"></i> Analytics
          </a>
          <a href="admin-reports.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-file-lines w-5 text-center"></i> Reports
          </a>
          <a href="admin-notifications.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-bell w-5 text-center"></i> Notifications
          </a>

          <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 mt-6">Settings</p>
          <a href="admin-settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-gear w-5 text-center"></i> Settings
          </a>
          <a href="admin-store-settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-store w-5 text-center"></i> Store Settings
          </a>
          <a href="admin-team.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-user-group w-5 text-center"></i> Team
          </a>
        </nav>

        <div class="px-4 py-4 border-t border-slate-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-brand-blue flex items-center justify-center text-sm font-bold" id="admin-avatar">A</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate" id="admin-name">Admin</p>
              <p class="text-xs text-slate-500 truncate" id="admin-email">—</p>
            </div>
            <button id="logout-btn" class="text-slate-500 hover:text-red-400 transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <div class="flex-1 lg:ml-64">

      <!-- Top Bar -->
      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="flex items-center justify-between px-4 sm:px-6 h-16">
          <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="lg:hidden text-slate-600 text-xl">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="text-lg font-bold text-slate-900">Orders</h1>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="p-4 sm:p-6 lg:p-8">

        <!-- Filters -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 sm:p-5 mb-6">
          <div class="flex flex-col sm:flex-row gap-4">
            <div class="flex-1 relative">
              <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input id="search-input" type="text" placeholder="Search by order number, customer name, email..."
                     class="w-full border border-slate-200 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue">
            </div>
            <select id="status-filter" class="border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 bg-white">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="packed">Packed</option>
              <option value="shipped">Shipped</option>
              <option value="out_for_delivery">Out for Delivery</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600">Order</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden md:table-cell">Customer</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600">Total</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden sm:table-cell">Status</th>
                  <th class="text-left px-6 py-4 font-semibold text-slate-600 hidden lg:table-cell">Date</th>
                  <th class="text-right px-6 py-4 font-semibold text-slate-600">Actions</th>
                </tr>
              </thead>
              <tbody id="orders-table" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="6" class="px-6 py-16 text-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                    <p>Loading orders...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <script>
    // ========== SUPABASE ==========
    const SUPABASE_URL = "https://zflruqzsbmiwvslcured.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6lR4Oh7YBMnPBxEx0Siy4A_QpTG8PHC";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allOrders = [];

    // ========== SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    
    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    });
    overlay?.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    // ========== STATUS BADGE ==========
    function getStatusBadge(status) {
      const styles = {
        pending: 'bg-amber-50 text-amber-700',
        confirmed: 'bg-blue-50 text-blue-700',
        processing: 'bg-indigo-50 text-indigo-700',
        packed: 'bg-purple-50 text-purple-700',
        shipped: 'bg-cyan-50 text-cyan-700',
        out_for_delivery: 'bg-orange-50 text-orange-700',
        delivered: 'bg-emerald-50 text-emerald-700',
        cancelled: 'bg-red-50 text-red-700',
        refunded: 'bg-slate-100 text-slate-600'
      };
      const label = (status || 'pending').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      return `<span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold ${styles[status] || styles.pending}">${label}</span>`;
    }

    // ========== AUTH ==========
    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'admin-login.html';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role, full_name')
        .eq('id', user.id)
        .single();

      if (!profile || !['admin', 'staff'].includes(profile.role)) {
        await supabaseClient.auth.signOut();
        window.location.href = 'admin-login.html';
        return;
      }

      const name = profile.full_name || user.email?.split('@')[0] || 'Admin';
      document.getElementById('admin-name').textContent = name;
      document.getElementById('admin-email').textContent = user.email;
      document.getElementById('admin-avatar').textContent = name.charAt(0).toUpperCase();

      loadOrders();
    }

    // ========== LOAD ORDERS ==========
    async function loadOrders() {
      try {
        const { data, error } = await supabaseClient
          .from('orders')
          .select(`
            id, order_number, status, total, created_at,
            customer_name, customer_email, customer_phone
          `)
          .order('created_at', { ascending: false });

        if (error) throw error;

        allOrders = data || [];
        renderOrders(allOrders);
      } catch (err) {
        console.error(err);
        // Fallback: show empty or localStorage demo order
        const lastOrder = localStorage.getItem('qb_last_order');
        if (lastOrder) {
          const order = JSON.parse(lastOrder);
          allOrders = [{
            id: order.id,
            order_number: order.id,
            status: order.status || 'pending',
            total: order.total || 0,
            created_at: order.createdAt,
            customer_name: order.customer?.fullName,
            customer_email: order.customer?.email,
            customer_phone: order.customer?.phone
          }];
          renderOrders(allOrders);
        } else {
          document.getElementById('orders-table').innerHTML = `
            <tr>
              <td colspan="6" class="px-6 py-16 text-center text-slate-400">
                <i class="fa-solid fa-box-open text-3xl mb-3"></i>
                <p>No orders yet</p>
              </td>
            </tr>`;
        }
      }
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('orders-table');

      if (!orders || orders.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-16 text-center text-slate-400">
              <i class="fa-solid fa-box-open text-3xl mb-3"></i>
              <p>No orders found</p>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = orders.map(order => {
        const date = order.created_at 
          ? new Date(order.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
          : '—';

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="px-6 py-4">
              <p class="font-semibold text-slate-900">${order.order_number || order.id}</p>
            </td>
            <td class="px-6 py-4 hidden md:table-cell">
              <p class="font-medium text-slate-800">${order.customer_name || '—'}</p>
              <p class="text-xs text-slate-500">${order.customer_email || ''}</p>
            </td>
            <td class="px-6 py-4 font-semibold text-slate-900">
              ₦${Number(order.total || 0).toLocaleString()}
            </td>
            <td class="px-6 py-4 hidden sm:table-cell">
              ${getStatusBadge(order.status)}
            </td>
            <td class="px-6 py-4 hidden lg:table-cell text-slate-600">${date}</td>
            <td class="px-6 py-4 text-right">
              <a href="admin-order-details.html?id=${order.id || order.order_number}" 
                 class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-blue hover:underline">
                View
                <i class="fa-solid fa-arrow-right text-xs"></i>
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    // ========== SEARCH & FILTER ==========
    function applyFilters() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const status = document.getElementById('status-filter').value;

      let filtered = allOrders;

      if (search) {
        filtered = filtered.filter(o => 
          (o.order_number || o.id || '').toLowerCase().includes(search) ||
          (o.customer_name || '').toLowerCase().includes(search) ||
          (o.customer_email || '').toLowerCase().includes(search)
        );
      }

      if (status) {
        filtered = filtered.filter(o => o.status === status);
      }

      renderOrders(filtered);
    }

    document.getElementById('search-input')?.addEventListener('input', applyFilters);
    document.getElementById('status-filter')?.addEventListener('change', applyFilters);

    // ========== LOGOUT ==========
    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      if (!confirm('Logout from admin panel?')) return;
      await supabaseClient.auth.signOut();
      window.location.href = 'admin-login.html';
    });

    // ========== INIT ==========
    checkAuth();
  </script>
</body>
</html>
